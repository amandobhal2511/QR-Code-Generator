<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Gen</title>


    <!-- Tailwind Dark Mode Configuration -->
    <script>
        tailwind = window.tailwind || {};

        tailwind.config = {
            darkMode: "class"
        };
    </script>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <rect width='100' height='100' rx='20' fill='%2300473f'/>
        <path d='M20 20h25v25H20zM55 20h25v25H55zM20 55h25v25H20zM58 58h8v8h-8zM70 58h10v10H70zM58 70h10v10H58zM72 72h8v8h-8z' fill='white'/>
        </svg>"
    >


    <!-- JavaScript -->
    <script src="script.js" defer></script>

</head>


<body
    class="min-h-screen
           bg-[#fafaf0]
           dark:bg-[#071b18]
           text-gray-900
           dark:text-gray-100
           transition-colors
           duration-300">


    <!-- Main -->
    <main
        class="relative
               flex
               flex-col
               items-center
               text-center
               px-5
               pt-12
               pb-16
               overflow-hidden">


        <!-- Background Glow -->
        <div
            class="absolute
                   -top-24
                   left-1/2
                   -translate-x-1/2
                   w-[550px]
                   h-[550px]
                   bg-emerald-200/30
                   dark:bg-emerald-900/20
                   blur-3xl
                   rounded-full
                   pointer-events-none">
        </div>


        <!-- Brand -->
         
        <div
            class="relative
                mb-8
                text-xl
                font-black
                tracking-tight
                text-white">

            QR<span class="text-emerald-400">.Gen</span>

        </div>


        <!-- Badge -->
        <div
            class="relative
                   mb-7
                   rounded-full
                   border
                   border-emerald-900/10
                   dark:border-emerald-300/10
                   bg-white/60
                   dark:bg-white/5
                   px-4
                   py-2
                   text-xs
                   tracking-widest
                   text-emerald-800
                   dark:text-emerald-300
                   uppercase
                   backdrop-blur-sm">

            Simple • Fast • Free

        </div>


        <!-- Heading -->
        <div
            class="heading
                   relative
                   max-w-4xl">


            <h1
                class="text-5xl
                       sm:text-6xl
                       md:text-7xl
                       font-black
                       tracking-tight
                       leading-[0.95]
                       text-gray-950
                       dark:text-white">

                Turn anything into

                <span
                    class="block
                           text-emerald-800
                           dark:text-emerald-400
                           italic">

                    a QR code.

                </span>

            </h1>

        </div>


        <!-- Description -->
        <p
            class="relative
                   mt-7
                   max-w-2xl
                   text-base
                   sm:text-lg
                   leading-relaxed
                   text-gray-600
                   dark:text-gray-400">

            Create a clean, downloadable QR code from any URL or text
            in seconds. No account required.

        </p>


        <!-- QR Generator Card -->
        <div
            class="relative
                   mt-12
                   w-full
                   max-w-xl">


            <div
                class="rounded-3xl
                       border
                       border-black/10
                       dark:border-white/10
                       bg-white/80
                       dark:bg-[#102a26]/90
                       backdrop-blur-xl
                       p-6
                       sm:p-8
                       shadow-xl
                       shadow-black/5
                       dark:shadow-black/30
                       transition-colors
                       duration-300">


                <!-- Input Section -->
                <div
                    class="input
                           text-left">


                    <label
                        for="qrInput"
                        class="mb-2
                               block
                               text-sm
                               font-semibold
                               text-gray-700
                               dark:text-gray-300">

                        Enter URL or Text

                    </label>


                    <input
                        type="text"
                        id="qrInput"
                        placeholder="https://example.com"
                        class="w-full
                               rounded-2xl
                               border
                               border-gray-200
                               dark:border-gray-700
                               bg-gray-50
                               dark:bg-gray-900/70
                               px-4
                               py-4
                               text-gray-900
                               dark:text-white
                               placeholder-gray-400
                               dark:placeholder-gray-500
                               outline-none
                               transition
                               focus:border-emerald-700
                               dark:focus:border-emerald-500
                               focus:ring-4
                               focus:ring-emerald-700/10
                               dark:focus:ring-emerald-500/10"
                    >


                    <!-- Validation Error -->
                    <p
                        id="errorMessage"
                        class="mt-2
                               hidden
                               text-sm
                               text-red-600
                               dark:text-red-400">

                        Please enter some text or URL

                    </p>

                </div>


                <!-- Generate Button -->
                <button
                    type="button"
                    id="generateButton"
                    class="mt-5
                           w-full
                           rounded-2xl
                           bg-emerald-900
                           dark:bg-emerald-700
                           px-5
                           py-4
                           font-semibold
                           text-white
                           transition
                           duration-200
                           hover:bg-emerald-800
                           dark:hover:bg-emerald-600
                           hover:-translate-y-0.5
                           active:translate-y-0
                           shadow-lg
                           shadow-emerald-900/20">

                    Generate QR Code

                </button>


                <!-- QR Container -->
                <div
                    id="qrContainer"
                    class="mt-7
                           flex
                           min-h-10
                           items-center
                           justify-center
                           rounded-2xl">

                    <!-- QR Code will appear here -->

                </div>


                <!-- Download Button -->
                <button
                    type="button"
                    id="downloadButton"
                    disabled
                    class="mt-5
                           w-full
                           rounded-2xl
                           border
                           border-gray-200
                           dark:border-gray-700
                           bg-gray-100
                           dark:bg-gray-800
                           px-5
                           py-4
                           font-semibold
                           text-gray-400
                           dark:text-gray-500
                           transition
                           disabled:cursor-not-allowed
                           enabled:bg-black
                           enabled:text-white
                           dark:enabled:bg-emerald-700
                           dark:enabled:hover:bg-emerald-600">

                    Download QR Code

                </button>

            </div>

        </div>


        <!-- Features -->
        <div
            class="relative
                   mt-10
                   flex
                   flex-wrap
                   justify-center
                   gap-x-8
                   gap-y-3
                   text-sm
                   text-gray-500
                   dark:text-gray-500">

            <span>✓ No signup</span>

            <span>✓ Instant generation</span>

            <span>✓ Downloadable</span>

        </div>

    </main>


    <!-- Footer -->
    <footer
        class="bg-[#fafaf0]
               dark:bg-[#071b18]
               pb-8
               text-center
               text-sm
               text-gray-400
               dark:text-gray-600
               transition-colors
               duration-300">

        QR.Gen — Simple QR generation.

    </footer>

</body>

</html>
