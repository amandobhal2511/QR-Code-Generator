<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">

        <div class="heading">
            <h1>QR Code Generator</h1>
        </div>

        <div class="input">
            <label for="qrInput">Enter URL or Text:</label>
            <input type="text" id="qrInput">
        </div>

        <button type="button" id="generateButton">Generate</button>

        <div id="qrContainer">
            <!-- QR Code will appear here -->
        </div>

        <button type="button" id="downloadButton" disabled>Download</button>

    </div>

</body>

</html>
